repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: detect-private-key
  - repo: local
    hooks:
      - id: impeccable-design
        name: impeccable design anti-pattern scan
        entry: bash -c 'cd apps/web && npx --yes impeccable detect src'
        language: system
        pass_filenames: false
        files: ^apps/web/src/.*\.(tsx?|css)$
      - id: no-emoji
        name: no emoji anywhere in the tree
        entry: python scripts/check_no_emoji.py
        language: system
        pass_filenames: true
      - id: mypy
        name: mypy --strict
        entry: mypy
        language: system
        pass_filenames: false
        types: [python]
